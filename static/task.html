<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task board · Ignatious</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/ui.css"><link rel="stylesheet" href="/static/planning.css"></head><body><div class="app-shell"><header class="topbar"><div class="brand"><a href="/static/index.html" class="brand-mark" aria-label="Ignatious home">IK</a><div class="title-block"><div class="eyebrow">Ignatious</div><h1 id="page-title">Task board</h1></div></div><div class="topbar-actions"><nav class="topbar-nav" aria-label="Main"><a class="nav-link " data-board-link href="/static/index.html">Board</a><a class="nav-link " data-plan-link href="/static/backlog.html">Planning</a><a class="nav-link" href="/static/needed.html">Needed work</a><a class="nav-link "  href="/team">Team</a></nav></div></header><div id="notice" class="notice" role="status" hidden></div><nav id="breadcrumbs" class="breadcrumbs" aria-label="Task hierarchy"></nav><main><form id="task-form" class="task-editor" hidden><div class="task-editor-main"><div class="field"><label for="title">Task title</label><input id="title" required maxlength="300"></div><div class="field"><label for="description">Description</label><textarea id="description" rows="5" placeholder="What needs to happen?"></textarea></div><div class="field"><label for="resolution-state">Resolution state</label><select id="resolution-state"><option>Unresolved</option><option>Partially resolved</option><option>Resolved</option><option>Deferred</option></select><p class="field-help">A settled decision does not automatically complete the task.</p></div><div class="field"><label for="resolution">Resolution / decisions</label><textarea id="resolution" rows="4" placeholder="What was decided, by whom, and what remains uncertain?"></textarea></div><div class="field"><label for="review-notes">Review notes</label><textarea id="review-notes" rows="3" placeholder="Observations and context for the next review."></textarea></div><div class="editor-actions"><button id="save-task" class="primary-button" type="submit">Save changes</button><button id="delete-task" class="secondary-button danger-button" type="button">Delete task</button></div></div><div class="task-editor-side"><div class="field"><label for="status">Status</label><select id="status"></select></div><div class="field"><label for="assignee">Assignee</label><select id="assignee"></select></div><div class="field"><label for="epic">Epic</label><select id="epic"></select></div><div class="field"><label for="parent">Parent task</label><select id="parent"></select></div><div class="field"><label for="task-sprint">Monthly sprint</label><select id="task-sprint"></select><p class="field-help" id="sprint-help"></p></div></div></form><section class="needed-section" aria-labelledby="needed-heading"><div class="subboard-heading"><div><h2 id="needed-heading">Needed tasks</h2><p>Capture a decision, investigation, or action. Link existing work or create a subtask.</p></div><button id="add-needed" class="primary-button" disabled>Add needed task</button></div><div id="needed-list" class="needed-list"></div></section><div class="subboard-heading"><div><h2>Subtask board</h2><p id="subtask-progress">Every subtask can have a board of its own.</p></div><button id="new-subtask" class="primary-button" disabled>Add subtask</button></div><div id="board" class="kanban-board" aria-label="Subtask board"></div></main></div><script src="/static/shared.js"></script><script src="/static/needed.js"></script><script src="/static/task.js"></script></body></html>
